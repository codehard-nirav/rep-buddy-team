name: CI

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]
  workflow_dispatch:

# A new push to the same PR cancels the previous run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Advisory for now: the codebase has a large pre-existing Prettier/lint
      # backlog. Flip continue-on-error to false once `bun run lint` is clean.
      - name: Lint
        run: bun run lint
        continue-on-error: true


      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://example.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_ci_placeholder' }}
          VITE_SUPABASE_PROJECT_ID: ${{ vars.VITE_SUPABASE_PROJECT_ID || 'ci-placeholder' }}

  e2e:
    name: Playwright smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      # Public smoke tests always run. Login / workout / progress flows run only
      # when a dedicated test account is configured as repo secrets.
      - name: Run Playwright smoke tests
        run: bun run test:e2e
        env:
          CI: "true"
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ vars.VITE_SUPABASE_PROJECT_ID || secrets.VITE_SUPABASE_PROJECT_ID }}
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}

      - name: Upload Playwright HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_attempt }}
          path: playwright-report
          retention-days: 7
          if-no-files-found: ignore

      # Screenshots, videos and traces for failed tests only (Playwright writes
      # them under test-results/<test>/ per the config's capture settings).
      - name: Upload Playwright failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures-${{ github.run_attempt }}
          path: |
            test-results/**/*.png
            test-results/**/*.webm
            test-results/**/*.zip
            test-results/**/*.md
            test-results/**/error-context*
          retention-days: 14
          if-no-files-found: ignore

      - name: Summarize failure artifacts
        if: ${{ failure() }}
        run: |
          {
            echo "### Playwright failure artifacts"
            echo ""
            echo "Download the \`playwright-failures-${{ github.run_attempt }}\` and \`playwright-report-${{ github.run_attempt }}\` artifacts from this run's summary page."
            echo ""
            echo "Traces (\`trace.zip\`) can be opened at https://trace.playwright.dev."
            echo ""
            if [ -d test-results ]; then
              echo '```'
              find test-results -type f \( -name '*.png' -o -name '*.webm' -o -name '*.zip' \) | sort
              echo '```'
            else
              echo "_No failure artifacts were produced._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"


